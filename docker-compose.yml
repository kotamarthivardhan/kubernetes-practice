services:

  frontend:

    build:
      context: ./frontend

    ports:
      - "80:80"

    depends_on:
      - backend


  backend:

    build:
      context: ./backend

    environment:

      PORT: 5000

      DB_HOST: mysql

      DB_USER: appuser

      DB_PASSWORD: apppassword

      DB_NAME: devopsdb

      APP_ENV: docker

    depends_on:
      - mysql


  mysql:

    image: mysql:8.0

    environment:

      MYSQL_ROOT_PASSWORD: rootpassword

      MYSQL_DATABASE: devopsdb

      MYSQL_USER: appuser

      MYSQL_PASSWORD: apppassword

    volumes:

      - mysql-data:/var/lib/mysql

      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql


volumes:

  mysql-data:
