apiVersion: apps/v1
kind: Deployment

metadata:
  name: demo-app-mysql-deployment
  namespace: app-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: demo-app-mysql

  template:
    metadata:
      labels:
        app: demo-app-mysql

    spec:
      containers:
        - name: demo-app-mysql-container
          image: mysql:8.0

          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-app-mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-app-mysql-secret
                  key: MYSQL_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: demo-app-mysql-configmap
                  key: MYSQL_DATABASE

            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: demo-app-mysql-configmap
                  key: MYSQL_USER

          volumeMounts:
            - name: demo-app-mysql-mount
              mountPath: /var/lib/mysql

      volumes:
        - name: demo-app-mysql-mount
          persistentVolumeClaim:
            claimName: demo-app-mysql-pvc
