apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qsr-orders-api-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ORG/qsr-gitops.git
    targetRevision: main
    path: helm/qsr-orders
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: qsr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
