apiVersion: v1
kind: Service
metadata:
  name: {{ include "qsr-orders.fullname" . }}
  labels:
    {{- include "qsr-orders.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "qsr-orders.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
